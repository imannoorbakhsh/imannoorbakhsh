# Refreshes the profile README's SVGs: the neofetch-style card, the link
# buttons and the Pac-Man contribution graph.
#
# fetch_stats.py reads the GitHub GraphQL API into cache/ (the lines-of-code
# walk is memoised in cache/loc.json); the build_* scripts then regenerate the
# SVGs. The cache is committed back so the next run only walks repos whose
# head commit actually moved.
name: Update Profile Card

on:
  schedule:
    - cron: "0 5 * * *"        # once a day
  workflow_dispatch:
  # Rebuild straight away when the art or a generator changes.
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "tools/**"
      - ".github/workflows/profile-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub stats
        env:
          # The built-in token covers all public figures. Add a personal
          # access token (read:user, repo) as the STATS_TOKEN secret to count
          # private contributions and repositories too.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python tools/fetch_stats.py

      - name: Rebuild the SVGs
        run: |
          python tools/build_card.py
          python tools/build_links.py
          python tools/build_pacman.py

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.svg cache
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "chore: refresh profile card stats"
          git pull --rebase origin main
          git push
